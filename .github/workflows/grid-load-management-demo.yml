name: Grid Load Management synthetic demo (no SCADA)

on:
  push:
    paths:
      - 'extensions/grid-load-management/**'
      - '.github/workflows/grid-load-management-demo.yml'
  pull_request:
    paths:
      - 'extensions/grid-load-management/**'
      - '.github/workflows/grid-load-management-demo.yml'
  workflow_dispatch:

jobs:
  synthetic-smoke:
    name: Check synthetic Grid Load Management model
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: extensions/grid-load-management
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned solver API
        run: python -m pip install -r requirements.txt
      - name: Validate non-confidential example dataset
        run: python examples/test_synthetic_data.py
      - name: First-hour CLPU restoration smoke test
        run: python synthetic_smoke_test.py
      - name: Execute small two-weight MILP demo
        run: python examples/run_synthetic_example.py --case small --time-limit 60 --output-dir demo_results
      - name: Upload synthetic demonstration results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grid-load-management-demo-results
          path: extensions/grid-load-management/demo_results/
          if-no-files-found: ignore
